apiVersion: candor.dev/v1alpha1
kind: SignalPolicy
metadata:
  labels:
    app.kubernetes.io/name: candor
    app.kubernetes.io/managed-by: kustomize
  name: signalpolicy-sample
spec:
  # Governs signals in this SignalPolicy's own namespace only - create one per namespace you
  # want Candor watching, same convention as ResourceQuota/NetworkPolicy.
  providers:
    - trivy
  minSeverity: HIGH
