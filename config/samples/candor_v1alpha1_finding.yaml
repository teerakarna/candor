apiVersion: candor.dev/v1alpha1
kind: Finding
metadata:
  labels:
    app.kubernetes.io/name: candor
    app.kubernetes.io/managed-by: kustomize
  name: finding-sample
spec:
  # Findings are normally created by a provider (see internal/provider/trivy), not applied by
  # hand - this sample exists to document the shape.
  source:
    provider: trivy
    kind: Deployment
    name: api
    refKind: VulnerabilityReport
    refName: api-abc123
  severity: CRITICAL
  summary: "3 critical, 5 high, 2 medium, 1 low vulnerabilities in ghcr.io/example/api:v1.2.3"
