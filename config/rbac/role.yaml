---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - aquasecurity.github.io
  resources:
  - vulnerabilityreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - candor.dev
  resources:
  - findings
  - operatingpolicies
  - signalpolicies
  - suppressions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - candor.dev
  resources:
  - findings/finalizers
  - operatingpolicies/finalizers
  - signalpolicies/finalizers
  - suppressions/finalizers
  verbs:
  - update
- apiGroups:
  - candor.dev
  resources:
  - findings/status
  - operatingpolicies/status
  - signalpolicies/status
  - suppressions/status
  verbs:
  - get
  - patch
  - update
