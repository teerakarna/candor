name: Scorecard supply-chain security

on:
  branch_protection_rule: {}
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write # needed to publish results to the public Scorecard API (powers the badge)
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN can't read classic branch protection rules (confirmed by the
          # Branch-Protection check's own -1 "internal error" result, not a real 0 - see
          # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md).
          # SCORECARD_TOKEN is a fine-grained PAT scoped to this repo only, read-only
          # "Administration" permission - nothing this token can do beyond reading branch
          # protection settings. Falls back to the default token (same as before) if the secret
          # isn't set, so this is safe to merge before the secret exists.
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
