name: TEMP image build timing

# Temporary, removed before merge. Runs the release image build (same action, same platforms, no
# QEMU) without pushing, to time it on a GitHub runner. No cache, so the number is a cold build.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build both platforms, no push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: mode=max
          sbom: false
