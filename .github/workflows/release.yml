name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Started on the tag by release-please.yml. CONTRIBUTING.md, "Releases", says when to start it by
  # hand. Only the newest tag should be built: every run of a final version moves :latest.
  workflow_dispatch:

# Every job below declares its own least-privilege permissions already - this is a defense-in-depth
# default so a job added later without its own block doesn't inherit the repo's default token scope.
permissions: {}

# A tag has two start paths (push and dispatch); two builds of one tag would race on its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A dispatch can name any branch or tag, and the image job would publish it as :latest.
  check-ref:
    name: Check the ref is a version tag
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check ref
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            exit 0
          fi
          echo "::error::$GITHUB_REF is not a version tag (vX.Y.Z), nothing was built"
          exit 1

  binaries:
    name: Build binaries + GitHub Release
    # The release body and install.yaml name the image tag, which only exists once the image job
    # has scanned, signed and tagged it.
    needs: [check-ref, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing of checksums.txt (Fulcio/Rekor via OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both of these have to happen after goreleaser, not before, and it took a local dry run of
      # the real thing to find out: `make build-installer` runs `kustomize edit set image`, which
      # edits config/manager/kustomization.yaml in the working tree, and goreleaser refuses to
      # release from a dirty tree ("git is in a dirty state"). Generating it first would also be
      # pointless anyway - `--clean` wipes dist/ before building, taking install.yaml with it.
      - name: Build install.yaml for this release
        run: make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Attach install.yaml to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist/install.yaml

  image:
    name: Build, sign, and attest the manager image
    needs: check-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (Fulcio/Rekor via OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pushed by digest only, with no tag: nothing points at it until the scan, signing and
          # SBOM below have passed and the last step tags it.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx's native SLSA-shaped provenance attestation - who built this, from what source,
          # with what build config. mode=max includes the full build definition, not just a summary.
          provenance: mode=max
          sbom: false # we generate and attest our own CycloneDX SBOM below instead

      # Trivy scans one platform of an index, the runner's unless told otherwise, so each is
      # scanned explicitly.
      - name: Trivy image scan (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Trivy image scan (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          skip-setup-trivy: true

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Signed last, after the scans and the SBOM attestation, so a run that fails earlier does not
      # leave a signed image that was never released.
      # Keyless signing: identity is the workflow's own OIDC token, verified against Fulcio/Rekor.
      # No stored key. Signs the digest, so it covers the tags added in the last step.
      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Tagging does not change the digest, so the signature and SBOM above still apply.
      # A prerelease (vX.Y.Z-rc.1) does not move :latest.
      - name: Tag the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tags=(-t "$IMAGE:$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          for t in "${tags[@]}"; do
            [[ "$t" == -t ]] && continue
            tagged=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [[ "$tagged" != "$DIGEST" ]]; then
              echo "::error::$t is $tagged, not the signed $DIGEST"
              exit 1
            fi
          done

  chart:
    name: Package and publish the Helm chart
    runs-on: ubuntu-latest
    needs: image # chart's values.yaml pins the image tag; image must exist before publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set chart version to the release tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version: .*/version: ${VERSION}/" charts/chart/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/chart/Chart.yaml

      - name: Package and push
        run: |
          helm package charts/chart --destination /tmp/chart-out
          helm push /tmp/chart-out/candor-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
