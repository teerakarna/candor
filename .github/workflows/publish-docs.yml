name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    # SHA-pinned to teerakarna/mkdocs-publisher's main, same discipline as every third-party
    # action in this repo (verified with `git -C <clone of mkdocs-publisher> rev-parse main`,
    # not guessed) - bump manually when that repo's workflow changes.
    uses: teerakarna/mkdocs-publisher/.github/workflows/publish.yml@b204fcc61673d5594a343af74ddca0b6c0e35d1b # main
    with:
      working-directory: docs-site
