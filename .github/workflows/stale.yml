name: Stale

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned"
          stale-issue-message: >
            No activity for 60 days. This will close in 14 days if nothing changes - comment to
            keep it open. (If this is a real, still-relevant issue, apologies for the auto-nag;
            label it `pinned` to stop this happening again.)
          stale-pr-message: >
            No activity for 60 days. This will close in 14 days if nothing changes.
