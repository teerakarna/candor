{{- if or (not (hasKey .Values.manager "enabled")) (.Values.manager.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "candor.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "candor.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "candor.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "candor.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      {{- $whPort := include "candor.webhookReceiverPort" . | int }}
      {{- $healthPort := include "candor.validatedPort" (dict "value" .Values.manager.healthProbe.port "name" "manager.healthProbe.port") | int }}
      {{- /*
      candor.validatedPort only rejects non-integer shapes (octal-looking, overflowing, etc.) - it
      deliberately still accepts a negative value, since that's a meaningful, valid input for
      manager.webhookReceiver.port specifically (see its own doc comment: "disabled", same as 0).
      healthProbe.port and metrics.port have no such meaning for a negative value - it's always
      invalid for them - so each gets its own explicit check here instead.
      */}}
      {{- if le $healthPort 0 }}
      {{- fail (printf "manager.healthProbe.port must be a positive integer, got %d" $healthPort) }}
      {{- end }}
      {{- if and (include "candor.portEnabled" $whPort) (eq $whPort $healthPort) }}
      {{- fail (printf "manager.webhookReceiver.port (%d) must not equal manager.healthProbe.port (%d)" $whPort $healthPort) }}
      {{- end }}
      {{- /*
      $metricsPort is only resolved (and validated) when metrics is actually enabled, not
      unconditionally above - an invalid metrics.port left over from when metrics was last enabled
      must not fail a deploy that has since turned metrics off and no longer references it at all.
      */}}
      {{- $metricsPort := 0 }}
      {{- if .Values.metrics.enabled }}
      {{- $metricsPort = include "candor.validatedPort" (dict "value" .Values.metrics.port "name" "metrics.port") | int }}
      {{- if le $metricsPort 0 }}
      {{- fail (printf "metrics.port must be a positive integer, got %d" $metricsPort) }}
      {{- end }}
      {{- if and (include "candor.portEnabled" $whPort) (eq $whPort $metricsPort) }}
      {{- fail (printf "manager.webhookReceiver.port (%d) must not equal metrics.port (%d)" $whPort $metricsPort) }}
      {{- end }}
      {{- end }}
      {{- /* values.yaml's webhook.port (9443, the admission-webhook server) isn't wired into any
      containerPort yet, so no collision check against it is needed - add one here if that ever
      changes. */}}
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ $metricsPort }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:{{ $healthPort }}
        - --signal-receiver-port={{ $whPort }}
        {{- range .Values.manager.args }}
        - {{ tpl . $ }}
        {{- end }}
        command:
        - /manager
        env:
        {{- if or .Values.manager.env (and (kindIs "map" .Values.manager.envOverrides) (not (empty .Values.manager.envOverrides))) }}
          {{- if .Values.manager.env }}
          {{- toYaml .Values.manager.env | nindent 10 }}
          {{- end }}
          {{- if kindIs "map" .Values.manager.envOverrides }}
          {{- range $k, $v := .Values.manager.envOverrides }}
          - name: {{ $k }}
            value: {{ $v | quote }}
          {{ end }}
          {{- end }}
          {{- else }}
          []
          {{- end }}
        image: "{{ .Values.manager.image.repository | default "controller" }}{{- if not (contains "@" (.Values.manager.image.repository | default "controller")) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ $healthPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: {{ $healthPort }}
          name: health
          protocol: TCP
        {{- if (include "candor.portEnabled" $whPort) }}
        - containerPort: {{ $whPort }}
          name: webhook-signal
          protocol: TCP
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ $healthPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- if .Values.manager.extraVolumeMounts }}
          {{- toYaml .Values.manager.extraVolumeMounts | nindent 10 }}
          {{- else }}
          []
          {{- end }}
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "candor.serviceAccountName" . }}
      {{- if and (hasKey .Values.manager "terminationGracePeriodSeconds") (ne .Values.manager.terminationGracePeriodSeconds nil) }}
      terminationGracePeriodSeconds: {{ .Values.manager.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        {{- if .Values.manager.extraVolumes }}
        {{- toYaml .Values.manager.extraVolumes | nindent 8 }}
        {{- else }}
        []
        {{- end }}
{{- end }}
