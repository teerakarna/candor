{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: signalpolicies.candor.dev
spec:
  group: candor.dev
  names:
    kind: SignalPolicy
    listKind: SignalPolicyList
    plural: signalpolicies
    singular: signalpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providers
      name: Providers
      type: string
    - jsonPath: .spec.minSeverity
      name: MinSeverity
      type: string
    - jsonPath: .status.budgetCallsUsed
      name: BudgetUsed
      type: integer
    - jsonPath: .spec.budget.maxCalls
      name: BudgetMax
      type: integer
    - jsonPath: .spec.webhook.url
      name: Webhook
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SignalPolicy is the Schema for the signalpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SignalPolicy
            properties:
              budget:
                description: |-
                  budget bounds LLM enrichment spend for this policy's namespace over a rolling window.
                  Optional - omitted means unlimited, relying entirely on the fingerprint gate (slice 3) to
                  bound cost. When the limit is reached, enrichment degrades to deterministic-only findings
                  until the window resets - it never silently keeps spending past the ceiling.
                properties:
                  maxCalls:
                    description: maxCalls is the maximum number of LLM enrichment
                      calls allowed within one window.
                    format: int32
                    minimum: 1
                    type: integer
                  windowSeconds:
                    default: 86400
                    description: |-
                      windowSeconds is the rolling window length. Rolling from whenever the window last reset,
                      not calendar-aligned - simpler to reason about, no timezone/cron edge cases.
                    format: int32
                    minimum: 60
                    type: integer
                required:
                - maxCalls
                type: object
              minSeverity:
                default: HIGH
                description: |-
                  minSeverity is the minimum signal severity that produces a Finding. Signals below this
                  threshold are ignored entirely - they never reach a Finding at all, so they can't
                  contribute noise even before suppression exists (see docs/design.md pillar 3).
                enum:
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
                type: string
              providers:
                description: |-
                  providers this policy enables, e.g. ["trivy"]. Deliberately a free-form string list rather
                  than a closed CRD enum: each provider's own reconciler simply ignores policies that don't
                  name it, so adding a new provider later never requires a schema migration here.
                items:
                  type: string
                minItems: 1
                type: array
              webhook:
                description: |-
                  webhook configures a generic JSON sink for this namespace - the same URL is used both for
                  immediate notifications (a Finding created, resolved, or recurred) and the periodic digest
                  (docs/design.md: "one code path covers Slack/Teams/PagerDuty/anything" - a single generic
                  payload shape, not a per-vendor integration). Optional - omitted means no notifications and
                  no digest for this namespace.
                properties:
                  url:
                    description: |-
                      url receives an HTTP POST with a JSON body on every notification and digest. Must be
                      http:// or https:// - checked at send time (internal/notify.Send), not admission time, to
                      keep the schema simple.
                    type: string
                required:
                - url
                type: object
            required:
            - providers
            type: object
          status:
            description: status defines the observed state of SignalPolicy
            properties:
              budgetCallsUsed:
                description: budgetCallsUsed is the number of LLM calls made within
                  the current budget window.
                format: int32
                type: integer
              budgetWindowStart:
                description: |-
                  budgetWindowStart is when the current budget window began. Unset means no window is active
                  yet - no enrichment call has been checked against this policy's budget since the last reset.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the SignalPolicy resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
