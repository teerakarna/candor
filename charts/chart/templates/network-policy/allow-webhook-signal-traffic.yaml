{{- /*
$whPort is resolved (and validated) only inside the networkPolicy.enabled guard, not
unconditionally above it: an invalid manager.webhookReceiver.port must not fail an unrelated
`networkPolicy.enabled=false` deploy that would never have rendered this rule - or referenced that
value - at all.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $whPort := include "candor.webhookReceiverPort" . | int }}
{{- if (include "candor.portEnabled" $whPort) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "candor.name" . }}
  name: {{ include "candor.resourceName" (dict "suffix" "allow-webhook-signal-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: {{ include "candor.name" . }}
  policyTypes:
    - Ingress
  ingress:
    # Deliberately open to any source, unlike allow-metrics-traffic's namespace-label restriction:
    # the receiver is meant to be reachable by external tools (SonarQube, Falco, etc.), and its
    # real access control is the per-SignalPolicy HMAC signature, not network segmentation.
    - ports:
        - port: {{ $whPort }}
          protocol: TCP
{{- end }}
{{- end }}
