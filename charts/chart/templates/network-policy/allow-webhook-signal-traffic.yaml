{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "candor.name" . }}
  name: {{ include "candor.resourceName" (dict "suffix" "allow-webhook-signal-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: {{ include "candor.name" . }}
  policyTypes:
    - Ingress
  ingress:
    # Deliberately open to any source, unlike allow-metrics-traffic's namespace-label restriction:
    # the receiver is meant to be reachable by external tools (SonarQube, Falco, etc.), and its
    # real access control is the per-SignalPolicy HMAC signature, not network segmentation.
    - ports:
        - port: 9444
          protocol: TCP
{{- end }}
