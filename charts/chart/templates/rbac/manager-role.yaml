apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "candor.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - aquasecurity.github.io
  resources:
  - vulnerabilityreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - candor.dev
  resources:
  - findings
  - signalpolicies
  - suppressions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - candor.dev
  resources:
  - findings/finalizers
  - signalpolicies/finalizers
  - suppressions/finalizers
  verbs:
  - update
- apiGroups:
  - candor.dev
  resources:
  - findings/status
  - signalpolicies/status
  - suppressions/status
  verbs:
  - get
  - patch
  - update
